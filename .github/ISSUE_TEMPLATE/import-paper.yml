name: Import paper submission
description: Submit a pinned Lean paper repository for meta-library import.
title: "Import paper: "
body:
  - type: markdown
    attributes:
      value: |
        Submit an exact GitHub commit that already builds as a Lean/Lake package.

        The workflow will check your GitHub username against the import allowlist,
        validate these fields, inspect the metadata-declared files, then run the
        submission checker against the pinned commit.

  - type: input
    id: repo_url
    attributes:
      label: GitHub repository URL
      description: The paper repository to import. Full GitHub URLs and owner/repo are accepted.
      placeholder: https://github.com/owner/paper-repo
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      description: The branch where this commit came from. This is recorded and checked against metadata.
      value: main
    validations:
      required: true

  - type: input
    id: commit_hash
    attributes:
      label: Pinned commit hash
      description: Full 40-character Git commit hash. Do not submit a branch name or short SHA.
      placeholder: "0000000000000000000000000000000000000000"
    validations:
      required: true

  - type: input
    id: metadata_path
    attributes:
      label: Metadata path
      description: Relative path to metadata-meta-library.yaml in the paper repo.
      value: metadata-meta-library.yaml
    validations:
      required: true

  - type: checkboxes
    id: submission_permission
    attributes:
      label: Submission permission
      options:
        - label: I am allowed to submit these results to the library.
          required: true
