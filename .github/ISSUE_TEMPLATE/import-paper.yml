name: Import paper submission
description: Submit a pinned Lean paper repository for meta-library import.
title: "Import paper: "
body:
  - type: markdown
    attributes:
      value: |
        Submit an exact GitHub commit that already builds as a Lean/Lake package.

        The workflow will check your GitHub username against the import allowlist,
        validate these fields, inspect the metadata-declared files, then run the
        submission checker against the pinned commit.

  - type: input
    id: commit_url
    attributes:
      label: GitHub commit URL
      description: Link to the exact GitHub commit to import. The workflow derives the repository, branch, and commit hash from this link.
      placeholder: https://github.com/owner/paper-repo/commit/0000000000000000000000000000000000000000
    validations:
      required: true

  - type: input
    id: metadata_path
    attributes:
      label: Metadata path
      description: Relative path to metadata-meta-library.yaml in the paper repo.
      value: metadata-meta-library.yaml
    validations:
      required: true

  - type: checkboxes
    id: submission_permission
    attributes:
      label: Submission permission
      options:
        - label: I am allowed to submit these results to the library.
          required: true
        - label: I take responsibility for this submission and confirm that it is meant only to document the formalization; it contains no hidden instructions, prompts, or content intended to mislead agents, harm people, or compromise systems.
          required: true
