name: Ingest Submitted Paper

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      source_commit_url:
        description: "GitHub commit URL for the exact submitted commit"
        required: true
      metadata_path:
        description: "Path to metadata-meta-library.yaml in the paper repo"
        required: true
        default: "metadata-meta-library.yaml"

permissions:
  contents: read
  issues: write

env:
  META_LIBRARY_REPOSITORY: clemenskuske/lean-meta-library
  META_LIBRARY_REF: main

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'import-submission') || startsWith(github.event.issue.title, 'Import paper:')))
    runs-on: ubuntu-latest
    outputs:
      source_repository: ${{ steps.submission.outputs.source_repository }}
      source_branch: ${{ steps.submission.outputs.source_branch }}
      source_commit: ${{ steps.submission.outputs.source_commit }}
      metadata_path: ${{ steps.submission.outputs.metadata_path }}
    steps:
      - name: Checkout import controller
        uses: actions/checkout@v5

      - name: Check GitHub username allowlist
        id: allowlist
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if grep -Fxiq "$ACTOR" .github/import-allowed-users.txt; then
            echo "Authorized import user: $ACTOR"
          else
            echo "User '$ACTOR' is not allowed to run this import workflow."
            exit 1
          fi

      - name: Comment on unauthorized issue submission
        if: failure() && github.event_name == 'issues' && steps.allowlist.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import submission was not accepted.",
                "",
                `Reason: \`${context.actor}\` is not on the import allowlist.`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Parse and validate submission fields
        id: submission
        env:
          GITHUB_TOKEN: ${{ secrets.SUBMISSION_READ_TOKEN || secrets.META_LIBRARY_PUSH_TOKEN || github.token }}
        run: node .github/scripts/prepare-submission.mjs

      - name: Comment on invalid issue submission
        if: failure() && github.event_name == 'issues' && steps.submission.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const details = fs.existsSync(".submission-error")
              ? fs.readFileSync(".submission-error", "utf8").trim()
              : "The submission form could not be parsed.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import submission was not accepted.",
                "",
                `Reason: ${details}`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });

      - name: Confirm target repository token
        id: target_token
        shell: bash
        env:
          META_LIBRARY_PUSH_TOKEN: ${{ secrets.META_LIBRARY_PUSH_TOKEN }}
        run: |
          if [ -z "$META_LIBRARY_PUSH_TOKEN" ]; then
            echo "Missing META_LIBRARY_PUSH_TOKEN. Add a fine-grained token that can read/write contents and pull requests in ${META_LIBRARY_REPOSITORY}."
            exit 1
          fi

      - name: Comment on import-site configuration failure
        if: failure() && github.event_name == 'issues' && steps.target_token.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import submission could not be validated because the import-site repository is missing required configuration.",
                "",
                "Reason: `META_LIBRARY_PUSH_TOKEN` is not configured.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });

      - name: Comment on accepted issue submission
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import submission accepted for validation.",
                "",
                `Repository: \`${{ steps.submission.outputs.source_repository }}\``,
                `Branch: \`${{ steps.submission.outputs.source_branch }}\``,
                `Commit: \`${{ steps.submission.outputs.source_commit }}\``,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import controller
        uses: actions/checkout@v5
        with:
          path: import-controller

      - name: Checkout meta-library
        uses: actions/checkout@v5
        with:
          repository: ${{ env.META_LIBRARY_REPOSITORY }}
          ref: ${{ env.META_LIBRARY_REF }}
          path: meta-library
          token: ${{ secrets.META_LIBRARY_PUSH_TOKEN }}

      - name: Checkout submitted paper at pinned commit
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: submitted-paper
          persist-credentials: false
          token: ${{ secrets.SUBMISSION_READ_TOKEN || secrets.META_LIBRARY_PUSH_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Confirm pinned checkout
        shell: bash
        env:
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          echo "Submitted branch: $SOURCE_BRANCH"
          echo "Submitted commit: $SOURCE_COMMIT"
          actual_commit="$(git -C submitted-paper rev-parse HEAD)"
          if [ "${actual_commit,,}" != "${SOURCE_COMMIT,,}" ]; then
            echo "Submitted checkout resolved to $actual_commit, not $SOURCE_COMMIT"
            exit 1
          fi

      - name: Validate metadata and surface declaration
        id: metadata
        env:
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          METADATA_PATH: ${{ needs.prepare.outputs.metadata_path }}
        run: node import-controller/.github/scripts/validate-submission-metadata.mjs

      - name: Build checker container
        run: docker build -f meta-library/containers/submission-checker/Dockerfile -t meta-library-submission-checker meta-library

      - name: Validate submitted paper
        shell: bash
        env:
          METADATA_PATH: ${{ needs.prepare.outputs.metadata_path }}
          SURFACE_PATH: ${{ steps.metadata.outputs.surface_path }}
          USAGE_FEEDBACK_PATH: ${{ steps.metadata.outputs.usage_feedback_path }}
          USAGE_LESSONS_PATH: ${{ steps.metadata.outputs.usage_lessons_path }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$USAGE_FEEDBACK_PATH" ]; then
            EXTRA_ARGS+=(--usage-feedback "$USAGE_FEEDBACK_PATH")
          fi
          if [ -n "$USAGE_LESSONS_PATH" ]; then
            EXTRA_ARGS+=(--usage-lessons "$USAGE_LESSONS_PATH")
          fi
          docker run --rm \
            -v "$PWD/submitted-paper:/submission" \
            meta-library-submission-checker \
            --repo /submission \
            --metadata "$METADATA_PATH" \
            --surface "$SURFACE_PATH" \
            "${EXTRA_ARGS[@]}" \
            --json

      - name: Import submitted paper into meta-library
        id: import
        working-directory: meta-library
        shell: bash
        env:
          METADATA_PATH: ${{ needs.prepare.outputs.metadata_path }}
          SURFACE_PATH: ${{ steps.metadata.outputs.surface_path }}
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          USAGE_FEEDBACK_PATH: ${{ steps.metadata.outputs.usage_feedback_path }}
          USAGE_LESSONS_PATH: ${{ steps.metadata.outputs.usage_lessons_path }}
          IMPORT_USER_ID: ${{ github.actor }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$USAGE_FEEDBACK_PATH" ]; then
            EXTRA_ARGS+=(--usage-feedback "$USAGE_FEEDBACK_PATH")
          fi
          if [ -n "$USAGE_LESSONS_PATH" ]; then
            EXTRA_ARGS+=(--usage-lessons "$USAGE_LESSONS_PATH")
          fi
          npm run import:paper -- \
            --repo "$GITHUB_WORKSPACE/submitted-paper" \
            --metadata "$METADATA_PATH" \
            --surface "$SURFACE_PATH" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-branch "$SOURCE_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --import-user-id "$IMPORT_USER_ID" \
            --github-output "$GITHUB_OUTPUT" \
            "${EXTRA_ARGS[@]}"

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false

      - name: Update Lake manifest
        working-directory: meta-library
        run: lake update

      - name: Build meta-library
        working-directory: meta-library
        run: lake build

      - name: Commit and push import branch
        working-directory: meta-library
        shell: bash
        env:
          IMPORT_BRANCH: ${{ steps.import.outputs.import_branch }}
          PAPER_ID: ${{ steps.import.outputs.paper_id }}
          VERSION: ${{ steps.import.outputs.version }}
        run: |
          git switch -C "$IMPORT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MetaLibrary papers.csv lakefile.lean lake-manifest.json
          if git diff --cached --quiet; then
            echo "Importer produced no commit-ready changes."
            exit 1
          fi
          git commit -m "Import ${PAPER_ID} ${VERSION}"
          git push --force-with-lease origin "HEAD:${IMPORT_BRANCH}"

      - name: Open or update import pull request
        id: pr
        working-directory: meta-library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.META_LIBRARY_PUSH_TOKEN }}
          IMPORT_BRANCH: ${{ steps.import.outputs.import_branch }}
          PAPER_ID: ${{ steps.import.outputs.paper_id }}
          PAPER_TITLE: ${{ steps.import.outputs.paper_title }}
          VERSION: ${{ steps.import.outputs.version }}
          SURFACE_MODULE: ${{ steps.import.outputs.surface_module }}
          SOURCE_REPO_URL: ${{ steps.import.outputs.source_repo_url }}
          SOURCE_BRANCH: ${{ steps.import.outputs.source_branch }}
          SOURCE_COMMIT: ${{ steps.import.outputs.source_commit }}
        run: |
          cat > import-pr-body.md <<EOF
          Automated paper import from the import-site workflow.

          - Paper: ${PAPER_TITLE} (${PAPER_ID})
          - Version: ${VERSION}
          - Surface module: \`${SURFACE_MODULE}\`
          - Source repo: ${SOURCE_REPO_URL}
          - Source branch: ${SOURCE_BRANCH}
          - Source commit: \`${SOURCE_COMMIT}\`

          Validation completed before import:
          - submitted repo checked out at the pinned commit
          - metadata and surface preflight passed
          - checker container passed
          - Lake manifest updated
          - full meta-library build passed
          EOF

          existing_pr="$(gh pr list --repo "$META_LIBRARY_REPOSITORY" --head "$IMPORT_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "$META_LIBRARY_REPOSITORY" --title "Import ${PAPER_ID} ${VERSION}" --body-file import-pr-body.md
            pr_url="$(gh pr view "$existing_pr" --repo "$META_LIBRARY_REPOSITORY" --json url --jq '.url')"
          else
            pr_url="$(gh pr create \
              --repo "$META_LIBRARY_REPOSITORY" \
              --base "$META_LIBRARY_REF" \
              --head "$IMPORT_BRANCH" \
              --title "Import ${PAPER_ID} ${VERSION}" \
              --body-file import-pr-body.md)"
          fi
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Comment on passed issue submission
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import validation passed.",
                "",
                "The submitted repository checked out at the pinned commit, the checker ran, the import branch was pushed, and the meta-library PR was opened or updated.",
                "",
                `Pull request: ${{ steps.pr.outputs.pr_url }}`,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });

      - name: Close successful issue submission
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "completed"
            });

      - name: Comment on failed issue validation
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Import validation failed.",
                "",
                "Check the workflow logs for the exact failing validation step.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });
