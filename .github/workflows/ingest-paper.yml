name: Ingest Submitted Paper

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "GitHub repository in owner/name form"
        required: true
      source_branch:
        description: "Submitted branch name"
        required: true
      source_commit:
        description: "Pinned 40-character commit hash"
        required: true
      metadata_path:
        description: "Path to metadata-meta-library.yaml in the paper repo"
        required: true
        default: "metadata-meta-library.yaml"
      surface_path:
        description: "Path to the surface file in the paper repo"
        required: true
        default: "Surface.lean"
      usage_feedback_path:
        description: "Optional path to used-formalizations.json in the paper repo"
        required: false
        default: ""
      usage_lessons_path:
        description: "Optional path to used-formalization-lessons.md in the paper repo"
        required: false
        default: ""

permissions:
  contents: read

env:
  META_LIBRARY_REPOSITORY: clemenskuske/lean-meta-library
  META_LIBRARY_REF: main

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import controller
        uses: actions/checkout@v4

      - name: Check GitHub username allowlist
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if grep -Fxiq "$ACTOR" .github/import-allowed-users.txt; then
            echo "Authorized import user: $ACTOR"
          else
            echo "User '$ACTOR' is not allowed to run this import workflow."
            exit 1
          fi

      - name: Confirm target repository token
        shell: bash
        env:
          META_LIBRARY_PUSH_TOKEN: ${{ secrets.META_LIBRARY_PUSH_TOKEN }}
        run: |
          if [ -z "$META_LIBRARY_PUSH_TOKEN" ]; then
            echo "Missing META_LIBRARY_PUSH_TOKEN. Add a fine-grained token that can read and write ${META_LIBRARY_REPOSITORY}."
            exit 1
          fi

      - name: Validate dispatch inputs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          METADATA_PATH: ${{ inputs.metadata_path }}
          SURFACE_PATH: ${{ inputs.surface_path }}
          USAGE_FEEDBACK_PATH: ${{ inputs.usage_feedback_path }}
          USAGE_LESSONS_PATH: ${{ inputs.usage_lessons_path }}
        run: |
          valid_path() {
            local value="$1"
            [[ "$value" =~ ^[A-Za-z0-9._/-]+$ ]] || return 1
            [[ "$value" != /* ]] || return 1
            [[ "$value" != */ ]] || return 1
            [[ "$value" != *"//"* ]] || return 1
            [[ "$value" != "." ]] || return 1
            [[ "$value" != ".." ]] || return 1
            [[ "$value" != ../* ]] || return 1
            [[ "$value" != */.. ]] || return 1
            [[ "$value" != */../* ]] || return 1
          }

          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid source_repository"; exit 1; }
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid source_branch"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid source_commit"; exit 1; }
          valid_path "$METADATA_PATH" || { echo "Invalid metadata_path"; exit 1; }
          valid_path "$SURFACE_PATH" || { echo "Invalid surface_path"; exit 1; }
          [[ -z "$USAGE_FEEDBACK_PATH" ]] || valid_path "$USAGE_FEEDBACK_PATH" || { echo "Invalid usage_feedback_path"; exit 1; }
          [[ -z "$USAGE_LESSONS_PATH" ]] || valid_path "$USAGE_LESSONS_PATH" || { echo "Invalid usage_lessons_path"; exit 1; }

  validate:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout meta-library
        uses: actions/checkout@v4
        with:
          repository: ${{ env.META_LIBRARY_REPOSITORY }}
          ref: ${{ env.META_LIBRARY_REF }}
          path: meta-library
          token: ${{ secrets.META_LIBRARY_PUSH_TOKEN }}

      - name: Checkout submitted paper at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_commit }}
          path: submitted-paper
          persist-credentials: false
          token: ${{ secrets.SUBMISSION_READ_TOKEN || secrets.META_LIBRARY_PUSH_TOKEN || github.token }}

      - name: Confirm pinned checkout
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          echo "Submitted branch: $SOURCE_BRANCH"
          echo "Submitted commit: $SOURCE_COMMIT"
          actual_commit="$(git -C submitted-paper rev-parse HEAD)"
          if [ "${actual_commit,,}" != "${SOURCE_COMMIT,,}" ]; then
            echo "Submitted checkout resolved to $actual_commit, not $SOURCE_COMMIT"
            exit 1
          fi

      - name: Build checker container
        run: docker build -f meta-library/containers/submission-checker/Dockerfile -t meta-library-submission-checker meta-library

      - name: Validate submitted paper
        shell: bash
        env:
          METADATA_PATH: ${{ inputs.metadata_path }}
          SURFACE_PATH: ${{ inputs.surface_path }}
          USAGE_FEEDBACK_PATH: ${{ inputs.usage_feedback_path }}
          USAGE_LESSONS_PATH: ${{ inputs.usage_lessons_path }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$USAGE_FEEDBACK_PATH" ]; then
            EXTRA_ARGS+=(--usage-feedback "$USAGE_FEEDBACK_PATH")
          fi
          if [ -n "$USAGE_LESSONS_PATH" ]; then
            EXTRA_ARGS+=(--usage-lessons "$USAGE_LESSONS_PATH")
          fi
          docker run --rm \
            -v "$PWD/submitted-paper:/submission" \
            meta-library-submission-checker \
            --repo /submission \
            --metadata "$METADATA_PATH" \
            --surface "$SURFACE_PATH" \
            "${EXTRA_ARGS[@]}" \
            --json

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false

      - name: Build meta-library
        working-directory: meta-library
        run: lake build

      - name: Next step
        run: echo "Submission validation passed and the meta-library builds. Import commit creation will use META_LIBRARY_PUSH_TOKEN once the importer is implemented."
